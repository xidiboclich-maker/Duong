<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Trang bán xe mô tô</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      over-flow-x: hidden;
    }

    .navigation-menu {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .content {
      width: 100%;
      height: 1250px;
      background-color: black;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 75px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: #ffffff25 solid 1px;
      backdrop-filter: blur(25px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 50px;
    }

    nav ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
      display: flex;
      position: absolute;
      left: 12%;
      white-space: nowrap; 
      flex-wrap: nowrap;
      gap: 50px;
    }

    nav ul li {
      display: inline;
    }

    nav ul li a {
      display: block;
      position: relative;
      letter-spacing: 0.2em;
      text-decoration: none;
      text-shadow: #ffffff 0px 0px 5px;
      font-family:'Raleway', sans-serif;
      font-weight: 400;
      font-size: 17.5px;
      color: rgba(255, 255, 255, 0.849);
      transition: 0.5s;
    }

    nav ul li a:hover {
      color: #ffffff;
      transform: scale(1.2);
      text-shadow: #ffffff 0px 0px 15px;
    }

    .logo img {
      height: 60px;
      width: auto;
      display: block;
    }
    .search-wrapper {
      display: flex;
      justify-content: flex-end;
      min-width: 200px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.144);
      border-radius: 25px;
      padding: 6px 15px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .search-box:hover, .search-box:focus-within {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-family: 'Raleway', sans-serif;
      font-size: 17.5px;
      width: 100px;
      transition: width 0.4s;
    }

    .search-box input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .search-box input:focus {
      width: 175px;
    }

    .search-box button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 14px;
      margin-left: 5px;
      opacity: 0.7;
      transition: 0.3s;
    }

    .search-box button:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    video {
      position: absolute;
      width: 100%;
      right:0;
      left: 0;
      border-bottom: #ffffff75 solid 2px;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      transform: translateX(0);
    }
    h1 {
      color: white;
      font-family: 'Raleway', serif;
      font-size: 75px;
      font-weight: 400;
      text-align: center;
      text-shadow: #ffffff 0px 0px 10px;
      padding-top: 250px;
    }
    </style>
</head>
<body>
  <div class="navigation-menu">
  <video src="R3.mp4" autoplay muted loop></video>
    <nav>
    <div class="logo">
        <a href="#"><img src="DHNQ.png" alt="Logo"></a>
    </div>
    <ul>
        <li><a href="#Home">TRANG CHỦ</a></li>
        <li><a href="#About">GIỚI THIỆU</a></li>
        <li><a href="#Models">SẢN PHẨM</a></li>
        <li><a href="#Price">GIÁ XE</a></li>
        <li><a href="#Services">DỊCH VỤ</a></li>
        <li><a href="#Contact">LIÊN HỆ</a></li>
    </ul>
    <div class="search-wrapper">
      <div class="search-box">
        <input type="text" placeholder="Tìm kiếm">
        <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
    </div>
    </nav>
  </div>
  <div class="content">
    <h1>CÁC MẪU XE</h1>
  </div>
</body>
</html>
