<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Thu Thập Thông Tin Bệnh Nhân</title>
</head>
<body>
  <form action="/action_page.php"></form>
  <div class="ThongTinBenhNhan">
    <h2>PHIẾU THU THẬP THÔNG TIN BỆNH NHÂN</h2>
    
    <div class="titles">1.Thông tin bệnh nhân</div>
    <div class="row">
      <div class="col">
        <label>Mã bệnh nhân:</label>
        <input type="text" required>
      </div>
      <div class="col">
        <label>Họ và tên:</label>
        <input type="text" required>
      </div>
      <div class="col">
        <label>Ngày tháng năm sinh:</label>
        <input type="date" max="2026-01-01" required>
      </div>
    </div>
    
    <div class="row">
      <div class="col">
        <label>CMND</label>
        <input type="text" required>
      </div>
      <div class="col">
        <label>Nghề nghiệp</label>
        <input type="text" required>
      </div>
      <div class="col">
        <label>Số điện thoại</label>
        <input type="tel" required>
      </div>
    </div>
    
    <div class="row">
      <div class="col" style="flex: 1">
        <label>Địa chỉ</label>
        <input type="text" required>
      </div>
      <div class="col">
        <label>Mã BHYT</label>
        <input type="tel" required>
      </div>
    </div>

    <div class="titles">2. Tình trạng ban đầu:</div>
    <div class="row">
      <div class="col">
        <label>Chiều cao</label>
        <input type="text" placeholder="cm" required>
      </div>
      <div class="col">
        <label>Cân nặng</label>
        <input type="number" placeholder="Kg" required>
      </div>
      <div class="col">
        <label>Huyết áp</label>
        <input type="number" placeholder="mmHg" required>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>SPO2 </label>
        <input type="number" placeholder="%" required>
      </div>
      <div class="col">
        <label>Khả năng di chuyển: tự đi được, không tự đi được, dùng xe lăn,...</label>
        <input type="text" required>
      </div>
    </div>

    <div class="titles">3. Chẩn đoán ban đầu: </div>
    <div class="row">
      <div class="col">
        <label>Mã chẩn đoán </label>
        <input type="text" required>
      </div>
      <div class="col">
        <label>Nội dung chẩn đoán</label>
        <textarea rows="5" cols="60" required></textarea>
      </div>
    </div>
    
    <div class="titles">4. Đặt hẹn: </div>
    <div class="row" gap="20px">
      <div class="col">
        <label>Ngày:</label>
        <input type="date" min="2026-02-01" required>
      </div>
      <div class="col">
        <label>Buổi khám:</label>
        <select required>
          <option>Sáng</option>
          <option>Trưa</option>
          <option>Chiều</option>
          <option>Tối</option>
        </select>
      </div>
      <div class="col">
        <label>Tên bác sĩ + chuyên khoa:</label>
        <select required>
          <option>1. TS.BS Nguyễn Anh Dũng	(Quản lý Y tế / Ngoại khoa)</option>
          <option>2. CKII Trần Đặng Khuê Anh	(Nội tổng quát)</option>
          <option>3. TS.BS Võ Hồng Khôi	(Nội thần kinh)</option>
          <option>4. BS.CKII Nguyễn Đỗ Anh	(Tim mạch can thiệp)</option>
          <option>5. BS.CKII Võ Văn Nhựt Nam	Ngoại tiêu hóa</option>
          <option>6. BS.CKII Mai Phan Tường Anh	(Ngoại chấn thương chỉnh hình)</option>
          <option>7. TS.BS Bùi Chí Thương	(Sản phụ khoa)</option>
          <option>8. BS.CKII Vương Thị Ngọc Lan	(Hiếm muộn / Sản khoa)</option>
          <option>9. BS.CKII Nguyễn Thị Thu Hà	(Nội tiết - Thận)</option>
          <option>10. BS.CKII Huỳnh Văn Ân	(Hồi sức tích cực - Chống độc)</option>
          <option>11. BS.CKII Nguyễn Thanh Sử	(Cấp cứu)</option>
          <option>12. TS.BS Trần Ngọc Sĩ	(Ngoại Thần kinh)</option>
          <option>13. BS.CKII Phạm Thị Ngọc Quyên	(Nội Thần kinh)</option>
          <option>14. BS.CKII Nguyễn Ngọc Duy	(Tai Mũi Họng)</option>
          <option>15. BS.CKII Nguyễn Văn Tuấn	(Phẫu thuật Gây mê hồi sức)</option>
          <option>16. BS.CKII Đỗ Văn Nam	(Nội hô hấp)</option>
          <option>17. BS.CKII Lê Thị Đẹp	(Nội tim mạch)</option>
          <option>18. BS.CKI Nguyễn Thị Thúy Hằng	(Mắt (Nhãn khoa))</option>
          <option>19. BS.CKII Trần Thị Anh Tường	(Dinh dưỡng) </option>
          <option>20. BS.CKII Nguyễn Kiều Nhi	(Khám bệnh)</option>
        </select>
      </div>
      <div class="col">
        <label>Lý do khám:</label>
        <textarea rows="5" cols="100" required></textarea>
      </div>
      
        <button type="submit">Đặt Lịch</button>
        <button type="edit">Sửa</button>
        <button type="close">Đóng</button>
        <button type="print">In phiếu đăng kí khám</button>
      </form>
    
    </div>
  </div>
</body>
