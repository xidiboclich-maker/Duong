<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Thu Thập Thông Tin Bệnh Nhân</title>
    <style>
      body {
        background-color: rgb(255, 129, 150); 
        margin: 25px;
        background-image: linear-gradient(to Top, rgb(68, 35, 255), rgb(255, 129, 150));
      }

      .ThongTinKhamBenh {
          max-width: 600px;            
          background-color: white;
          padding: 20px;
          margin: auto;
          border-radius: 10px;
      }

      h2 {
        font-family: "Arial", sans-serif;
        font-size: 25px;
        text-align: center;
        color: black;
      }

      fieldset {
        border: 2.5px solid navy;
        border-radius: 10px;
        padding: 10px;
        margin-top: 10px;
      }

      legend.titles {
        font-family: "Arial", sans-serif;
        font-size: 18px;
        font-weight: 600;
        color: black;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 10px;
      }

      .col {
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      label {
        font-family: "Arial", sans-serif;
        font-size: 15px;
        font-weight: 400;
        color: black;
      }

      input, select, textarea {
        padding: 5px;
        border: 2px solid navy;
        border-radius: 10px;
        font-size: 15px;
      }

      button {
        cursor: pointer;
        background-color: white;
        color: navy;
        padding: 10px;
        border: 2px solid navy;
        border-radius: 5px;
        font-size: 15px;
        margin-top: 10px;
      }

      p {
        margin-top: 20px;
        line-height: 0.25;
        font-family: "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 400;
        color: rgb(255, 255, 255);
        text-align: center;
      }
    </style>
</head>
<body>
  <form action="/action_page.php">
  <div class="ThongTinKhamBenh">
    <h2>PHIẾU THU THẬP THÔNG TIN BỆNH NHÂN</h2>
    
    <Fieldset>
    <legend class="titles">1.Thông tin bệnh nhân:</legend>
    <div class="row">
      <div class="col">
        <label>Mã bệnh nhân:</label>
        <input type="text" required>
      </div>
      <div class="col">
        <label>Họ và tên:</label>
        <input type="text" required>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <label>Ngày tháng năm sinh:</label>
        <input type="date" max="2026-01-01" required>
      </div>
      <div class="col">
        <label>CMND</label>
        <input type="text" required>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <label>Nghề nghiệp</label>
        <input type="text" required>
      </div>
      <div class="col">
        <label>Số điện thoại</label>
        <input type="tel" required>
      </div>
    </div>
    
    <div class="row">
      <div class="col">
        <label>Địa chỉ</label>
        <input type="text" required>
      </div>
      <div class="col">
        <label>Mã BHYT</label>
        <input type="tel" required>
      </div>
    </div>
    </Fieldset>

    <Fieldset>
    <legend class="titles">2. Tình trạng ban đầu:</legend>
    <div class="row">
      <div class="col">
        <label>Chiều cao</label>
        <input type="text" placeholder="cm" required>
      </div>
      <div class="col">
        <label>Cân nặng</label>
        <input type="number" placeholder="Kg" required>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Huyết áp</label>
        <input type="number" placeholder="mmHg" required>
      </div>
      <div class="col">
        <label>SPO2 </label>
        <input type="number" placeholder="%" required>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <label>Khả năng di chuyển: tự đi được, không tự đi được, dùng xe lăn,...</label>
        <input type="text" required>
      </div>
    </div>
    </Fieldset>

    <Fieldset>
    <legend class="titles">3. Chẩn đoán ban đầu: </legend>
    <div class="row">
      <div class="col">
        <label>Mã chẩn đoán </label>
        <input type="text" required>
      </div>
      <div class="col">
        <label>Nội dung chẩn đoán</label>
        <textarea rows="5" cols="60" required></textarea>
      </div>
    </div>
    </Fieldset>
    
    <Fieldset>
    <legend class="titles">4. Đặt hẹn: </legend>
    <div class="row">
      <div class="col">
        <label>Ngày:</label>
        <input type="date" min="2026-02-01" required>
      </div>
      <div class="col">
        <label>Buổi khám:</label>
        <select required>
          <option>Sáng</option>
          <option>Trưa</option>
          <option>Chiều</option>
          <option>Tối</option>
        </select>
      </div>
      <div class="col">
        <label>Tên bác sĩ và chuyên khoa của họ:</label>
        <select required>
          <option>1. ThS.BS.CKII Nguyễn Trương Khương: Giám đốc Chuyên môn.</option>
          <option>2. TS.BS Nguyễn Kim Chung: Chuyên gia Ngoại Thần kinh – Sọ não – Cột sống.</option>
          <option>3. BS.CKII Võ Văn Mẫn: Trưởng khoa Chấn thương Chỉnh hình.</option>
          <option>4. TS.BS Lê Khâm Tuân: Trưởng khoa Ngoại Thần kinh - Cột sống.</option>
          <option>5. TS.BS Nguyễn Quốc Vinh: Trưởng khoa Ngoại Tổng hợp.</option>
          <option>6. BS.CKII Lê Văn Hiếu Nhơn: Bác sĩ khoa Ngoại Tổng hợp.</option>
          <option>7. BS.CKII Nguyễn Mỹ Bảo Anh: Trưởng khoa Khám bệnh.</option>
          <option>8. TTƯT.TS.BS Nguyễn Thị Thu Hương: Phòng khám Nội thận – Tiết niệu.</option>
          <option>9. BS.CKII Lê Thị Thu Sương: Bác sĩ Ung bướu.</option>
          <option>10. ThS.BS Nguyễn Hữu Lĩnh: Bác sĩ Nhi khoa.</option>
          <option>11. BS.CKII Huỳnh Thị Mai Ly: Nội hô hấp – Phòng khám Hô hấp.</option>
          <option>12. BS.CKII Vũ Thị Thu Hương: Trưởng khoa Gây mê hồi sức.</option>
          <option>13. BS.CKI Nguyễn Tôn Xuân Trí: Chuyên khoa Ngoại Tổng quát.</option>
          <option>14. ThS.BS.CKI Võ Anh Khương: Chuyên khoa Ngoại Tim mạch - Lồng ngực.</option>
          <option>15. BS.CKII Nguyễn Tấn Khanh: Chuyên khoa Chấn thương chỉnh hình.</option>
          <option>16. BS.CKII Nguyễn Duy Duy: Chuyên khoa Chấn thương chỉnh hình.</option>
          <option>17. BS.CKI Nguyễn Quang Đức: Chuyên khoa Ngoại Thần kinh - Cột sống.</option>
          <option>18. BS.CKI Nguyễn Duy Duy: Chuyên khoa Gây mê hồi sức.</option>
          <option>19. ThS.BS.CKI Trần Vũ Hoàng: Chuyên khoa Tim mạch.</option>
          <option>20. BS.CKI Phạm Tuấn Anh: Chuyên khoa Nội tổng quát. </option>
        </select>
      </div>
      <div class="col">
        <label>Lý do khám:</label>
        <textarea rows="5" cols="60" required></textarea>
      </div>
    </div>
    </Fieldset>
    <div class="buttongroup">
        <button type="submit">Đặt Lịch</button>
        <button type="edit">Sửa</button>
        <button type="close">Đóng</button>
        <button type="print">In phiếu đăng kí khám</button>
    </div>
  </form>
  </div>
  <p class="BVAiVy">Bệnh Viện Ái Vy</p>

</body>
</html>`
